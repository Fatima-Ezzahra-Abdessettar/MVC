apiVersion: networking.k8s.io/v1
kind: Ingress
metadata:
  name: monblog-ingress
  namespace: mvc-objet
spec:
  rules:
  - host: mvcobjet.local
    http:
      paths:
      - path: /
        pathType: Prefix
        backend:
          service:
            name: monblog-service
            port:
              number: 80
